<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, intial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/723c3761c1.js" cross_origin="anonymous"></script>
  <title>JS Video</title>
</head>
<body>
  <div class="vid-container">
    <video src="VID-20260815-WA0058.mp4"></video>
    <div id="controls">
      
      <button id="play-pause"><i class="fas fa-play"></i></button>
      <span id="time">0:00</span>
      <input type="range"id="range">
      <span id="duration">0:00</span>
      <button id="fullscreen-btn"><i class="fas fa-expand"></i></button>
      <button id="mute-btn"><i class="fas fa-volume-up"></i></button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1">
    </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
